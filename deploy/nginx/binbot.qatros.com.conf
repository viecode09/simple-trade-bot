# Nginx site config untuk simple-trade-bot
# Domain : binbot.qatros.com
# Salin ke : /etc/nginx/sites-available/binbot.qatros.com
#           lalu symlink ke /etc/nginx/sites-enabled/
#
# Setelah config ini aktif, jalankan certbot untuk mengaktifkan HTTPS otomatis:
#   sudo certbot --nginx -d binbot.qatros.com
# (certbot akan menambah server block 443 + redirect HTTP->HTTPS tanpa menghapus location di bawah)

upstream simple_trade_bot {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name binbot.qatros.com;

    # Untuk validasi Let's Encrypt (webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 1m;

    # Server-Sent Events (saldo & posisi live): tanpa buffering, timeout panjang
    location /api/stream {
        proxy_pass http://simple_trade_bot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://simple_trade_bot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
